name: Feature request
description: Suggest a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
      description: Existing commands or settings that came close.

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project keeps a few hard rules — see CONTRIBUTING.md.
      options:
        - label: My suggestion does not require adding an npm dependency
        - label: My suggestion works with only Node.js built-ins
