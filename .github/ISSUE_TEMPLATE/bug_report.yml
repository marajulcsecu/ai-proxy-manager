name: Bug report
description: Something in the proxy, CLI or dashboard does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key.** The proxy masks keys everywhere it can; please
        redact anything that starts with `sk-` before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ai-proxy add-provider example https://example.com/v1
        2. ai-proxy start --daemon
        3. …
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `ai-proxy status`
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `ai-proxy logs -n 50`, or the dashboard's Requests view.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ai-proxy version`.
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows (WSL), Other]
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client tool
      description: Claude Code, VS Code, curl, something else.
